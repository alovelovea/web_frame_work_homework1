<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 목록 - Product Management</title>
    <style>
        body { font-family: 'Malgun Gothic', Arial, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; color: #333; }
        h1 { border-bottom: 2px solid #4a90d9; padding-bottom: 10px; color: #2c3e50; }
        .btn { display: inline-block; padding: 8px 16px; background: #4a90d9; color: white; text-decoration: none; border-radius: 4px; margin-bottom: 16px; }
        .btn:hover { background: #357abd; }
        .search-area { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #dee2e6; }
        .search-form { display: flex; gap: 10px; align-items: center; }
        .search-input { padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; width: 250px; }
        .search-select { padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; background: white; }
        .btn-search { padding: 8px 20px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-reset { color: #666; text-decoration: none; font-size: 0.9em; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #4a90d9; color: white; padding: 12px; text-align: left; }
        td { padding: 10px 12px; border-bottom: 1px solid #ddd; vertical-align: middle; }
        .price { text-align: right; font-weight: bold; color: #e74c3c; }
        .detail-link { color: #4a90d9; text-decoration: none; }
        .edit-link { color: #e67e22; text-decoration: none; margin-right: 8px; }
        .btn-delete { background: none; border: none; color: #e74c3c; cursor: pointer; text-decoration: underline; }
        .alert-success { background: #d4edda; color: #155724; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; }
        .empty-msg { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>

    <h1>상품 목록</h1>

    <div class="alert-success" th:if="${successMessage}">
        <span th:text="${successMessage}">성공 메시지</span>
    </div>

    <a class="btn" th:href="@{/products/create}">+ 새 상품 등록</a>

    <div class="search-area">
        <form th:action="@{/products}" method="get" class="search-form">
            <input type="text" name="keyword" th:value="${keyword}" class="search-input" placeholder="상품명 검색..."/>
            <select name="categoryId" class="search-select">
                <option value="">-- 전체 카테고리 --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == categoryId}"></option>
            </select>
            <button type="submit" class="btn-search">검색</button>
            <a th:href="@{/products}" class="btn-reset">초기화</a>
        </form>
    </div>

    <div class="empty-msg" th:if="${#lists.isEmpty(products)}">
        등록된 상품이 없습니다.
    </div>

    <table th:unless="${#lists.isEmpty(products)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>상품명</th>
                <th>카테고리</th>
                <th>가격</th>
                <th>작업</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td>
                    <a class="detail-link" th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">상품명</a>
                </td>
                
                <td>
                    <span th:if="${product.category != null}" th:text="${product.category.name}">전자제품</span>
                    <span th:unless="${product.category != null}">-</span>
                </td>

                <td class="price">
                    <span th:if="${product.price != null}" 
                          th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 0, 'POINT')} + '원'">15,000원</span>
                    <span th:unless="${product.price != null}">0원</span>
                </td>

                <td>
                    <a class="edit-link" th:href="@{/products/{id}/edit(id=${product.id})}">수정</a>
                    <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" style="display: inline;" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                        <button type="submit" class="btn-delete">삭제</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div style="margin-top: 50px;"></div> <hr>
    
    <footer style="text-align: center; padding: 20px 0; background-color: #f9f9f9; width: 100%;">
        <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 (E) a hh:mm:ss') + ' | 학번: 2071162 | 성명: 박민재'}" 
           style="font-size: 16px; color: #333; font-weight: bold;">
        </p>
    </footer>
</body>
</html>
